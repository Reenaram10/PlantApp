<!DOCTYPE html>
<html>

<head>
  <title>Green-Buy Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #f3f8f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      width: 350px;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      color: #006400;
    }

    h3 {
      color: #333;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #006400;
      box-shadow: 0 0 5px rgba(0, 100, 0, 0.3);
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      background: #006400;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
      transition: background 0.3s;
    }

    button:hover {
      background: #004d00;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .link-btn {
      background: #444;
    }

    .link-btn:hover {
      background: #222;
    }

    .guest-btn {
      background: #d4af37;
      color: black;
    }

    .guest-btn:hover {
      background: #c19a1f;
    }

    .msg {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }

    .msg.error {
      color: #d32f2f;
      background: #ffebee;
      display: block;
    }

    .msg.success {
      color: #388e3c;
      background: #e8f5e9;
      display: block;
    }

    .loader {
      display: none;
      text-align: center;
      margin: 10px 0;
    }

    .loader.active {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #006400;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>🌿 Green-Buy</h2>

    <!-- LOGIN -->
    <div id="loginBox">
      <h3>Login</h3>

      <!-- Admin Credentials Display Box -->
      <div
        style="margin: 10px 0; padding: 10px; background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; font-size: 13px;">
        <strong style="color: #2e7d32; display: block; margin-bottom: 4px;">🔑 Admin Credentials</strong>
        <div>Username: <b>admin</b></div>
        <div>Password: <b>admin@123</b></div>
        <button type="button" onclick="fillAdminCredentials()"
          style="margin-top: 6px; padding: 6px; font-size: 12px; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%;">Quick
          Fill Admin Credentials</button>
      </div>

      <input type="text" id="loginEmail" placeholder="Email or Username" required>
      <input type="password" id="loginPass" placeholder="Password" required>

      <div class="loader" id="loginLoader">
        <div class="spinner"></div>
      </div>

      <button onclick="handleLogin()" id="loginBtn">Login</button>

      <button class="link-btn" onclick="showRegister()">New user? Register</button>
      <button class="guest-btn" onclick="guestLogin()">Continue as Guest</button>
    </div>

    <!-- REGISTER -->
    <div id="registerBox" style="display:none;">
      <h3>Register</h3>
      <input type="text" id="regUsername" placeholder="Username" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPass" placeholder="Password (min 6 chars)" required>

      <div class="loader" id="registerLoader">
        <div class="spinner"></div>
      </div>

      <button onclick="handleRegister()" id="registerBtn">Register</button>

      <button class="link-btn" onclick="showLogin()">Already have account? Login</button>
      <button class="guest-btn" onclick="guestLogin()">Continue as Guest</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    // ✅ Dynamic API Base URL
    const API_BASE_URL = window.location.origin;

    function fillAdminCredentials() {
      document.getElementById("loginEmail").value = "admin";
      document.getElementById("loginPass").value = "admin@123";
      clearMsg();
    }

    function showMsg(message, type = "error") {
      const msgEl = document.getElementById("msg");
      msgEl.textContent = message;
      msgEl.className = `msg ${type}`;
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    function clearMsg() {
      const msgEl = document.getElementById("msg");
      msgEl.textContent = "";
      msgEl.className = "msg";
    }

    function showRegister() {
      clearMsg();
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("registerBox").style.display = "block";
    }

    function showLogin() {
      clearMsg();
      document.getElementById("registerBox").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
    }

    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPass").value.trim();
      const loginBtn = document.getElementById("loginBtn");
      const loginLoader = document.getElementById("loginLoader");

      if (!email || !password) {
        showMsg("⚠️ Please enter email/username and password!", "error");
        return;
      }

      try {
        loginBtn.disabled = true;
        loginLoader.classList.add("active");
        clearMsg();

        console.log("Attempting login with:", { email, API_BASE_URL });

        const response = await fetch(`${API_BASE_URL}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        console.log("Response status:", response.status);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        console.log("Login response:", data);

        if (data.status === "success") {
          // ✅ Store user data
          localStorage.setItem("user_id", data.user_id);
          localStorage.setItem("email", data.email);
          localStorage.setItem("username", data.username);
          localStorage.setItem("user", JSON.stringify({
            id: data.user_id,
            username: data.username,
            email: data.email
          }));

          const isAdmin = (data.username && data.username.toLowerCase() === "admin") ||
            (data.email && data.email.toLowerCase().includes("admin"));

          if (isAdmin) {
            showMsg("✅ Admin Login successful! Redirecting to Admin Dashboard...", "success");
            setTimeout(() => {
              window.location.href = "admin.html";
            }, 800);
          } else {
            showMsg("✅ Login successful! Redirecting...", "success");
            setTimeout(() => {
              window.location.href = "index.html";
            }, 800);
          }
        } else {
          showMsg(`❌ ${data.message || "Login failed!"}`, "error");
        }
      } catch (error) {
        console.error("Login error:", error);
        if (error.message.includes("Failed to fetch")) {
          showMsg(`❌ Cannot connect to server. Make sure backend is running at ${API_BASE_URL}`, "error");
        } else {
          showMsg(`❌ ${error.message}`, "error");
        }
      } finally {
        loginBtn.disabled = false;
        loginLoader.classList.remove("active");
      }
    }

    async function handleRegister() {
      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPass").value.trim();
      const registerBtn = document.getElementById("registerBtn");
      const registerLoader = document.getElementById("registerLoader");

      if (!username || !email || !password) {
        showMsg("⚠️ All fields are required!", "error");
        return;
      }

      if (username.length < 3) {
        showMsg("⚠️ Username must be at least 3 characters!", "error");
        return;
      }

      if (!email.includes("@")) {
        showMsg("⚠️ Please enter a valid email!", "error");
        return;
      }

      if (password.length < 6) {
        showMsg("⚠️ Password must be at least 6 characters!", "error");
        return;
      }

      try {
        registerBtn.disabled = true;
        registerLoader.classList.add("active");
        clearMsg();

        console.log("Attempting register with:", { username, email, API_BASE_URL });

        const response = await fetch(`${API_BASE_URL}/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ username, email, password })
        });

        console.log("Response status:", response.status);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        console.log("Register response:", data);

        if (data.status === "success") {
          // ✅ Store user data
          localStorage.setItem("user_id", data.user_id);
          localStorage.setItem("email", data.email);
          localStorage.setItem("username", data.username);
          localStorage.setItem("user", JSON.stringify({
            id: data.user_id,
            username: data.username,
            email: data.email
          }));

          showMsg("✅ Registration successful! Redirecting...", "success");

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        } else {
          showMsg(`❌ ${data.message || "Registration failed!"}`, "error");
        }
      } catch (error) {
        console.error("Register error:", error);
        if (error.message.includes("Failed to fetch")) {
          showMsg(`❌ Cannot connect to server. Make sure backend is running at ${API_BASE_URL}`, "error");
        } else {
          showMsg(`❌ ${error.message}`, "error");
        }
      } finally {
        registerBtn.disabled = false;
        registerLoader.classList.remove("active");
      }
    }

    function guestLogin() {
      localStorage.setItem("user_id", "anonymous");
      localStorage.setItem("username", "Guest");
      localStorage.removeItem("email");
      window.location.href = "index.html";
    }

    // Debug: Log API URL on page load
    window.addEventListener("load", () => {
      console.log("🌿 Green-Buy Auth Page Loaded");
      console.log("API Base URL:", API_BASE_URL);
    });
  </script>
